name: Deploy Aon wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare single-page website
        run: |
          mkdir -p _site
          cp public/index.html public/styles.css public/app.js public/CNAME _site/
          if [ -d public/uploads ]; then cp -R public/uploads _site/uploads; fi
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
